<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The reel's burn alone: a ragged black blob with a soft grey rim, so it shows on dark and light tabs. -->
  <defs>
    <path
      id="blob"
      d="M9.4 8.6c2.4-2.6 6.4-2.8 9-1.3 1.8 1 2.2 3 3.9 4 1.9 1.1 2.7 3.5 1.8 5.7-.7 1.6.5 3.1-.6 4.6-1.4 2-4.2 1.8-6 3-2.2 1.4-5.2 1-7-.9-1.4-1.6-1-3.6-2.3-5.2-1.5-1.9-1.6-4.8-.1-6.7.6-.8.7-2.2 1.3-3.2z"
    />
    <filter id="rim" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" />
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8" />
    </filter>
  </defs>
  <use href="#blob" fill="#a8a8a8" filter="url(#rim)" transform="translate(16 16) scale(1.18) translate(-16 -16)" />
  <use href="#blob" fill="#050505" filter="url(#soft)" />
</svg>
